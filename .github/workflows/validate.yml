name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  threadhelm-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Resolve ThreadHelm version
        shell: bash
        run: |
          VERSION="$(awk -F': ' '$1 == "Version" { print $2; exit }' macos/VERSION.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "THREADHELM_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "THREADHELM_RELEASE_ID=ThreadHelm-macOS-arm64-$VERSION" >> "$GITHUB_ENV"
      - name: Install ripgrep for the privacy audit
        # The runner image ships no rg, and the audit needs it to scan at all.
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Reject unresolved merge markers
        run: "! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)'"
      - name: Validate ThreadHelm repository layout
        run: python3 scripts/validate-repository-layout.py
      - run: ./macos/ThreadHelm/scripts/build.sh
      - name: Verify ThreadHelm macOS arm64 app and behavior
        run: |
          set -euo pipefail
          APP='macos/ThreadHelm/build/ThreadHelm.app'
          BIN="$APP/Contents/MacOS/ThreadHelm"
          lipo "$BIN" -verify_arch arm64
          test "$(lipo -archs "$BIN")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dev.threadhelm.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" = "ThreadHelm"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = "ThreadHelm.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "12.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "2"
          ! /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist" >/dev/null 2>&1
          test -f "$APP/Contents/Resources/ThreadHelm.icns"
          test ! -e "$APP/Contents/Resources/ThreadHelmPetSpritesheet.webp"
          test "$(vtool -show-build "$BIN" | grep -c 'minos 12.3')" -eq 1
          codesign --verify --deep --strict "$APP"
          "$BIN" --print-panel-config | grep -F "version=$THREADHELM_VERSION edition=threadhelm productID=threadhelm presentation=dynamic-island codexWeeklyQuotaOnly=true claudeQuotaPeriods=5h,weekly,fable"
          "$BIN" --self-test-lifecycle | grep -F 'dynamic-island-only=visibility+commands'
          "$BIN" --self-test-native-notification-state | grep -F 'native-notification-state-self-test:'
          "$BIN" --self-test-task-progress | grep -F 'agent-core=5+builtin+sixth'
          "$BIN" --self-test-threadhelm-edition | grep -F 'edition=threadhelm app-id=dev.threadhelm.app product=standalone'
          "$BIN" --self-test-weekly-quota | grep -F 'dynamic-island-phases=6/6'
          "$BIN" --self-test-claude-quota | grep -F 'provider-availability=installed+hidden fallback=pass'
          "$BIN" --self-test-claude-hook | grep -F 'claude-hook-self-test:'
          "$BIN" --self-test-client-contract | grep -F 'agent-transport=64KiB+250ms+metadata-only+fail-open'
          "$BIN" --self-test-dynamic-island | grep -F 'presentation=dynamic-island-only'
          "$BIN" --self-test-agent-integration-manager | grep -F 'agent-integration-manager-self-test:'
          "$BIN" --verify-agent-truth macos/ThreadHelm/Tests/Fixtures/Agents | grep -F 'agent-truth-replay: agents=5 scenarios=81 persistent-state=unchanged'
      - name: Run script regression tests
        run: |
          set -euo pipefail
          for test_script in scripts/tests/*.py; do
            python3 "$test_script"
          done
          for test_script in scripts/tests/*.sh; do
            zsh "$test_script"
          done
      - name: Build and inspect ThreadHelm macOS release
        run: |
          set -euo pipefail
          ./scripts/build-macos-release.sh
          RELEASE="$THREADHELM_RELEASE_ID"
          test -f "dist/$RELEASE.zip"
          test -f "dist/$RELEASE.zip.sha256"
          test -e "build/release/$RELEASE/ThreadHelm.app"
          test -e "build/release/$RELEASE/dev.threadhelm.app.plist.in"
          test ! -e "build/release/$RELEASE/pet"
          test ! -e "build/release/$RELEASE/quota-panel"
          unzip -tq "dist/$RELEASE.zip"
          ./scripts/privacy-audit.sh
      - run: zsh -n macos/package/*.command macos/ThreadHelm/scripts/*.sh script/*.sh scripts/*.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.THREADHELM_RELEASE_ID }}
          if-no-files-found: error
          path: |
            dist/${{ env.THREADHELM_RELEASE_ID }}.zip
            dist/${{ env.THREADHELM_RELEASE_ID }}.zip.sha256
